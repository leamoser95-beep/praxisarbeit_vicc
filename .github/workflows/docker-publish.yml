# CI-Pipeline: baut bei jeder Änderung im Ordner app/ das Container-Image
# und veröffentlicht es auf Docker Hub.
#
# Benötigte Repository-Secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME  Docker-Hub-Benutzername
#   DOCKERHUB_TOKEN     Access Token von Docker Hub (nicht das Passwort)

name: Build und Push nach Docker Hub

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/docker-publish.yml"]
  workflow_dispatch: # erlaubt manuelles Starten im Tab "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # Zwei Tags: "latest" und der kurze Commit-Hash.
      # Der Commit-Tag ist unveränderlich und wird für Deployments/Rollbacks verwendet.
      - name: Kurzen Commit-Hash ermitteln
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/autovermietung:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/autovermietung:${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
