{% extends "base.html" %}
{% block title %}Konto erstellen{% endblock %}
{% block content %}
<section class="narrow">
    <h1>Konto erstellen</h1>

    <form method="POST" class="form">
        <label for="username">Benutzername</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="password">Passwort <span class="hint">(mindestens 8 Zeichen)</span></label>
        <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>

        <button type="submit" class="btn">Konto erstellen</button>
    </form>

    <p class="aside">Schon registriert? <a href="{{ url_for('auth.login') }}">Anmelden</a></p>
</section>
{% endblock %}
